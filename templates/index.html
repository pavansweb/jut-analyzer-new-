<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JEE Mock Analyser</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231B2A41'/%3E%3Ctext x='32' y='40' font-size='22' font-family='Georgia,serif' fill='%23EFF1EC' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,680&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFF1EA;
    --paper-raised:#F7F8F3;
    --ink:#1B2A41;
    --ink-soft:#51607A;
    --ink-faint:#8A93A6;
    --rule:#CBD1C4;
    --rule-strong:#A9B0A0;
    --good:#2F7A52;
    --alert:#B8442E;
    --milestone:#B4841F;
    --milestone-bg:#F4E9CF;
    --focus:#1B2A41;
    --radius:3px;
    --shadow:0 1px 0 rgba(27,42,65,.06);
    font-size:16px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--rule) 1px, transparent 1px) 0 0/100% 32px,
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  .wrap{max-width:1080px; margin:0 auto; padding:28px 20px 80px;}

  /* ---------- Header ---------- */
  header.top{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:16px; padding-bottom:18px; border-bottom:2px solid var(--ink);
    margin-bottom:22px;
  }
  .brand{display:flex; gap:14px; align-items:center;}
  .seal{
    width:46px; height:46px; border-radius:50%;
    background:var(--ink); color:var(--paper-raised);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-size:19px; font-weight:680;
    flex:none;
  }
  .brand h1{
    font-family:'Fraunces', serif; font-weight:680; font-size:clamp(22px,3.4vw,30px);
    margin:0; letter-spacing:-.01em;
  }
  .brand .sub{
    font-size:12.5px; color:var(--ink-soft); letter-spacing:.06em; text-transform:uppercase;
    margin-top:3px;
  }
  .gear-btn{
    background:none; border:1px solid var(--rule-strong); color:var(--ink-soft);
    width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .gear-btn:hover{border-color:var(--ink); color:var(--ink);}

  /* ---------- Tab bars ---------- */
  .tabbar{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:14px;
    scrollbar-width:thin;
  }
  .tabbar::-webkit-scrollbar{height:5px;}
  .tabbar::-webkit-scrollbar-thumb{background:var(--rule-strong); border-radius:4px;}

  .tab{
    flex:none; cursor:pointer; background:var(--paper-raised);
    border:1px solid var(--rule-strong); color:var(--ink-soft);
    padding:8px 16px; font-size:14px; font-weight:500;
    border-radius:var(--radius); white-space:nowrap;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .tab:hover{color:var(--ink); border-color:var(--ink);}
  .tab.active{
    background:var(--ink); color:var(--paper-raised); border-color:var(--ink);
  }

  .tabbar.subjects .tab{
    font-family:'Fraunces', serif; font-weight:560; font-size:15px;
  }

  /* ---------- Stat strip ---------- */
  .stats{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--rule-strong); border:1px solid var(--rule-strong);
    margin-bottom:22px; border-radius:var(--radius); overflow:hidden;
  }
  .stat{background:var(--paper-raised); padding:14px 16px;}
  .stat .label{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint);
    margin-bottom:6px;
  }
  .stat .value{
    font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .stat .value.trend-up{color:var(--good);}
  .stat .value.trend-down{color:var(--alert);}
  @media (max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr);}
  }

  /* ---------- Chart ---------- */
  .chart-card{
    background:var(--paper-raised); border:1px solid var(--rule-strong);
    border-radius:var(--radius); padding:18px 18px 6px; margin-bottom:26px;
  }
  .chart-card h2{
    font-family:'Fraunces',serif; font-weight:560; font-size:16px; margin:0 0 10px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .chart-card h2 .legend{
    font-family:'IBM Plex Sans',sans-serif; font-weight:400; font-size:11.5px; color:var(--ink-soft);
    display:flex; gap:14px; text-transform:none; letter-spacing:0;
  }
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .legend i{width:10px; height:10px; display:inline-block; border-radius:50%;}
  .legend i.line{background:var(--ink);}
  .legend i.checkpoint{background:var(--milestone); transform:rotate(45deg); border-radius:2px;}
  svg.chart{width:100%; height:auto; display:block;}
  .chart text{font-family:'IBM Plex Mono', monospace;}
  .grid-line{stroke:var(--rule); stroke-width:1;}
  .axis-line{stroke:var(--rule-strong); stroke-width:1;}
  .data-line{fill:none; stroke:var(--ink); stroke-width:2;}
  .data-dot{fill:var(--paper-raised); stroke:var(--ink); stroke-width:2;}
  .checkpoint-dot{fill:var(--milestone);}
  .axis-label{fill:var(--ink-faint); font-size:10px;}
  .avg-tick text{fill:var(--milestone); font-size:9.5px; font-weight:600;}

  /* ---------- Table ---------- */
  .table-card{
    background:var(--paper-raised); border:1px solid var(--rule-strong); border-radius:var(--radius);
    overflow:hidden;
  }
  .table-card h2{
    font-family:'Fraunces',serif; font-weight:560; font-size:16px; margin:0; padding:16px 18px 12px;
    border-bottom:2px solid var(--ink);
  }
  .table-scroll{overflow-x:auto;}
  .table-columns{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));}
  .table-col + .table-col{border-left:1px solid var(--rule-strong);}
  @media(max-width:700px){
    .table-columns{grid-template-columns:1fr;}
    .table-col + .table-col{border-left:none; border-top:1px solid var(--rule-strong);}
  }
  table{width:100%; border-collapse:collapse; font-family:'IBM Plex Mono', monospace; font-size:13.5px;}
  thead th{
    text-align:left; padding:9px 14px; font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-soft); border-bottom:1px solid var(--rule-strong);
    font-family:'IBM Plex Sans',sans-serif; font-weight:600;
  }
  thead th.num, td.num{text-align:right;}
  tbody td{padding:7px 14px; border-bottom:1px solid var(--rule); font-variant-numeric:tabular-nums; white-space:nowrap;}
  tbody tr:hover td{background:rgba(27,42,65,.035);}
  tbody tr.milestone-row td{
    background:var(--milestone-bg); border-top:1px solid var(--milestone); border-bottom:1px solid var(--milestone);
    color:#5C4611; font-weight:600; white-space:normal;
  }
  tbody tr.milestone-row td.ms-label{font-family:'Fraunces',serif; font-style:italic; font-weight:560; font-size:12.5px;}
  td.pct-good{color:var(--good); font-weight:600;}
  td.pct-bad{color:var(--alert); font-weight:600;}

  /* ---------- States ---------- */
  .state{padding:60px 20px; text-align:center; color:var(--ink-soft);}
  .state h3{font-family:'Fraunces',serif; font-weight:560; color:var(--ink); margin:0 0 8px; font-size:18px;}
  .state p{margin:0; font-size:14px; max-width:420px; margin:0 auto;}
  .state.error h3{color:var(--alert);}

  /* ---------- Settings modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(27,42,65,.35); display:none;
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--paper-raised); border:1px solid var(--rule-strong); border-radius:6px;
    width:100%; max-width:440px; padding:22px 22px 20px; box-shadow:0 12px 32px rgba(27,42,65,.25);
  }
  .modal h3{font-family:'Fraunces',serif; margin:0 0 4px; font-size:19px;}
  .modal p.hint{font-size:12.5px; color:var(--ink-soft); margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:5px;}
  .field input{
    width:100%; padding:9px 11px; border:1px solid var(--rule-strong); border-radius:var(--radius);
    background:var(--paper); font-family:'IBM Plex Mono',monospace; font-size:13.5px; color:var(--ink);
  }
  .field input:focus{border-color:var(--ink);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  .btn{
    padding:9px 16px; border-radius:var(--radius); font-size:13.5px; cursor:pointer; font-weight:500;
    border:1px solid var(--rule-strong); background:var(--paper-raised); color:var(--ink);
  }
  .btn.primary{background:var(--ink); color:var(--paper-raised); border-color:var(--ink);}
  .btn:hover{border-color:var(--ink);}

  /* ---------- Add-student panel ---------- */
  .tab.tab-add{
    border-style:dashed; color:var(--ink-soft); background:transparent;
  }
  .tab.tab-add:hover{border-style:solid; color:var(--ink);}
  .add-panel{
    display:none; background:var(--paper-raised); border:1px solid var(--rule-strong); border-radius:var(--radius);
    padding:16px; margin:-6px 0 16px; max-width:420px;
  }
  .add-panel.open{display:block;}
  .add-panel h4{font-family:'Fraunces',serif; font-size:14.5px; margin:0 0 12px;}
  .add-panel .field{margin-bottom:10px;}
  .panel-msg{font-size:12.5px; margin-top:8px;}
  .panel-msg.ok{color:var(--good);}
  .panel-msg.err{color:var(--alert);}

  /* ---------- Enter-marks tab + form ---------- */
  .tab.tab-entry{
    border-color:var(--good); color:var(--good); font-weight:600;
  }
  .tab.tab-entry:hover{background:var(--good); color:var(--paper-raised); border-color:var(--good);}
  .tab.tab-entry.active{background:var(--good); color:var(--paper-raised); border-color:var(--good);}

  .entry-card{
    background:var(--paper-raised); border:1px solid var(--rule-strong); border-radius:var(--radius);
    padding:22px;
  }
  .entry-card h2{font-family:'Fraunces',serif; font-weight:560; font-size:18px; margin:0 0 4px;}
  .entry-card .entry-sub{font-size:13px; color:var(--ink-soft); margin:0 0 20px;}
  .entry-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:16px;}
  @media(min-width:560px){.entry-grid{grid-template-columns:repeat(4,1fr);}}
  .entry-grid .field{margin-bottom:0;}
  .entry-grid label{
    display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft);
    margin-bottom:6px;
  }
  .entry-grid input{
    width:100%; padding:11px 12px; border:1px solid var(--rule-strong); border-radius:var(--radius);
    background:var(--paper); font-family:'IBM Plex Mono',monospace; font-size:17px; color:var(--ink);
    font-weight:600; text-align:center;
  }
  .entry-grid input:focus{border-color:var(--good);}
  .entry-grid .field.test-no input{color:var(--ink-soft); font-weight:500;}
  .entry-actions{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .btn.entry-submit{background:var(--good); border-color:var(--good); color:var(--paper-raised); padding:11px 22px; font-weight:600;}
  .btn.entry-submit:hover{opacity:.92;}
  .entry-msg{font-size:13px;}
  .entry-msg.ok{color:var(--good);}
  .entry-msg.err{color:var(--alert);}

  footer.note{margin-top:22px; font-size:11.5px; color:var(--ink-faint); text-align:center;}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="seal">J</div>
      <div>
        <h1>JEE Mock Analyser</h1>
        <div class="sub">Test‑by‑test marks, tracked across 60 mocks</div>
      </div>
    </div>
    <button class="gear-btn" id="settingsBtn" title="Connection settings" aria-label="Connection settings">⚙</button>
  </header>

  <div class="tabbar" id="studentTabs"></div>
  <div class="add-panel" id="addStudentPanel">
    <h4>Add student</h4>
    <div class="field"><label>Student ID</label><input id="ns-id" placeholder="Enter student ID here" /></div>
    <div class="field"><label>Name</label><input id="ns-name" placeholder="Enter student name here" /></div>
    <button class="btn primary" id="ns-submit">Add student</button>
    <div class="panel-msg" id="ns-msg"></div>
  </div>

  <div class="tabbar subjects" id="subjectTabs">
    <button class="tab active" data-subject="physics">Physics</button>
    <button class="tab" data-subject="chemistry">Chemistry</button>
    <button class="tab" data-subject="maths">Maths</button>
    <button class="tab" data-subject="consolidated">Consolidated</button>
    <button class="tab tab-entry" data-mode="entry">+ Enter marks</button>
  </div>

  <div id="content"></div>

  <footer class="note">Use the gear icon to store your API write key so score entries save correctly.</footer>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h3>Connection settings</h3>
    <p class="hint">Store your write key so score entries and new students can be saved.</p>
    <div class="field">
      <label>Write key (X‑API‑Key)</label>
      <input id="cfg-key" type="password" placeholder="Enter your API write key here" />
    </div>
    <div class="modal-actions">
      <button class="btn" id="cfg-cancel">Cancel</button>
      <button class="btn primary" id="cfg-save">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const SUBJECT_MAX = { physics:100, chemistry:100, maths:100, consolidated:300 };
  const SUBJECT_LABEL = { physics:"Physics", chemistry:"Chemistry", maths:"Maths", consolidated:"Consolidated" };

  const state = {
    writeKey: localStorage.getItem("jee_write_key") || "",
    students: [],
    currentStudent: null,
    currentSubject: "physics",
    viewMode: "scores", // "scores" | "entry"
  };

  const el = (id) => document.getElementById(id);

  function apiUrl(path){
    return path;
  }

  async function apiGet(path){
    const res = await fetch(apiUrl(path));
    const body = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(body.error || ("Request failed (" + res.status + ")"));
    return body;
  }

  async function apiPost(path, payload){
    const res = await fetch(apiUrl(path), {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-API-Key": state.writeKey,
      },
      body: JSON.stringify(payload),
    });
    const body = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(body.error || ("Request failed (" + res.status + ")"));
    return body;
  }

  // ---------------- Settings modal ----------------
  el("settingsBtn").addEventListener("click", () => {
    el("cfg-key").value = state.writeKey;
    el("settingsOverlay").classList.add("open");
  });
  el("cfg-cancel").addEventListener("click", () => el("settingsOverlay").classList.remove("open"));
  el("settingsOverlay").addEventListener("click", (e) => { if(e.target.id === "settingsOverlay") el("settingsOverlay").classList.remove("open"); });
  el("cfg-save").addEventListener("click", () => {
    state.writeKey = el("cfg-key").value.trim();
    localStorage.setItem("jee_write_key", state.writeKey);
    el("settingsOverlay").classList.remove("open");
    loadStudents();
  });

  // ---------------- Students ----------------
  async function loadStudents(){
    const container = el("studentTabs");
    container.innerHTML = '<span style="color:var(--ink-faint); font-size:13px; padding:8px 0;">Loading students…</span>';
    try{
      const students = await apiGet("/api/students");
      state.students = students;
      renderStudentTabs();
      if(students.length){
        state.currentStudent = state.currentStudent && students.some(s => s.id === state.currentStudent)
          ? state.currentStudent : students[0].id;
        refreshView();
      } else {
        state.currentStudent = null;
        renderEmpty("No students yet", "Use \u201c+ Add student\u201d above the tabs to start tracking marks.");
      }
    } catch(err){
      container.innerHTML = "";
      renderError("Could not load students", err.message);
    }
  }

  function refreshView(){
    if(state.viewMode === "entry"){
      renderEntryForm();
    } else {
      loadScores();
    }
  }

  function renderStudentTabs(){
    const container = el("studentTabs");
    container.innerHTML = "";
    state.students.forEach(s => {
      const btn = document.createElement("button");
      btn.className = "tab" + (s.id === state.currentStudent ? " active" : "");
      btn.textContent = s.name;
      btn.addEventListener("click", () => {
        state.currentStudent = s.id;
        renderStudentTabs();
        refreshView();
      });
      container.appendChild(btn);
    });
    const addBtn = document.createElement("button");
    addBtn.className = "tab tab-add";
    addBtn.textContent = "+ Add student";
    addBtn.addEventListener("click", () => {
      el("addStudentPanel").classList.toggle("open");
    });
    container.appendChild(addBtn);
  }

  // ---------------- Subjects / entry mode ----------------
  el("subjectTabs").addEventListener("click", (e) => {
    const btn = e.target.closest(".tab");
    if(!btn) return;
    document.querySelectorAll("#subjectTabs .tab").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    if(btn.dataset.mode === "entry"){
      state.viewMode = "entry";
      renderEntryForm();
    } else {
      state.viewMode = "scores";
      state.currentSubject = btn.dataset.subject;
      loadScores();
    }
  });

  // ---------------- Scores / rendering ----------------
  async function loadScores(){
    if(!state.currentStudent) return;
    const content = el("content");
    content.innerHTML = '<div class="state"><h3>Fetching marks…</h3><p>Pulling ' + SUBJECT_LABEL[state.currentSubject] + ' scores from the tracker.</p></div>';
    try{
      const rows = await apiGet("/api/scores?student=" + encodeURIComponent(state.currentStudent) + "&subject=" + state.currentSubject);
      renderResults(rows);
    } catch(err){
      renderError("Could not load scores", err.message);
    }
  }

  function renderEmpty(title, msg){
    el("content").innerHTML = '<div class="state"><h3>' + escapeHtml(title) + '</h3><p>' + escapeHtml(msg) + '</p></div>';
  }
  function renderError(title, msg){
    el("content").innerHTML = '<div class="state error"><h3>' + escapeHtml(title) + '</h3><p>' + escapeHtml(msg) + '</p></div>';
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  function renderResults(rows){
    const content = el("content");
    const testRows = rows.filter(r => !r.cumulative);
    const milestoneRows = rows.filter(r => r.cumulative);

    if(!testRows.length){
      renderEmpty("No marks recorded", SUBJECT_LABEL[state.currentSubject] + " scores haven't been entered for this student yet.");
      return;
    }

    content.innerHTML = "";
    content.appendChild(buildStats(testRows));
    content.appendChild(buildChart(testRows, milestoneRows));
    content.appendChild(buildTable(rows));
  }

  function buildStats(testRows){
    const wrap = document.createElement("div");
    wrap.className = "stats";

    const latest = testRows[testRows.length - 1];
    const avgMarks = testRows.reduce((s,r) => s + r.marks, 0) / testRows.length;

    let trendLabel = "—", trendClass = "";
    if(testRows.length >= 6){
      const lastFive = testRows.slice(-5);
      const priorFive = testRows.slice(-10, -5);
      if(priorFive.length){
        const avg = arr => arr.reduce((s,r) => s + r.marks, 0) / arr.length;
        const diff = avg(lastFive) - avg(priorFive);
        trendLabel = (diff >= 0 ? "+" : "") + diff.toFixed(1) + " marks";
        trendClass = diff >= 0 ? "trend-up" : "trend-down";
      }
    }

    const stats = [
      { label: "Latest — Test " + latest.test_no, value: String(latest.marks) },
      { label: "Average marks", value: avgMarks.toFixed(1) },
      { label: "5‑test trend", value: trendLabel, cls: trendClass },
    ];

    stats.forEach(s => {
      const card = document.createElement("div");
      card.className = "stat";
      card.innerHTML = '<div class="label">' + s.label + '</div><div class="value ' + (s.cls||"") + '">' + s.value + "</div>";
      wrap.appendChild(card);
    });
    return wrap;
  }

  function buildChart(testRows, milestoneRows){
    const card = document.createElement("div");
    card.className = "chart-card";

    const W = 1000, H = 320, padL = 44, padR = 20, padT = 16, padB = 30;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    const maxTest = Math.max(...testRows.map(r => r.test_no));
    const minTest = Math.min(1, Math.min(...testRows.map(r => r.test_no)));
    const marksMax = Math.max(...testRows.map(r => r.max_marks));
    const xScale = (t) => padL + ((t - minTest) / Math.max(1, (maxTest - minTest))) * plotW;
    const yScale = (marks) => padT + plotH - (marks / marksMax) * plotH;

    let gridLines = "", axisLabelsY = "";
    [0, marksMax*0.25, marksMax*0.5, marksMax*0.75, marksMax].forEach(m => {
      const y = yScale(m);
      gridLines += '<line class="grid-line" x1="' + padL + '" y1="' + y + '" x2="' + (W-padR) + '" y2="' + y + '"></line>';
      axisLabelsY += '<text class="axis-label" x="' + (padL - 8) + '" y="' + (y+3) + '" text-anchor="end">' + Math.round(m) + '</text>';
    });

    let axisLabelsX = "";
    for(let t = minTest; t <= maxTest; t += 10){
      axisLabelsX += '<text class="axis-label" x="' + xScale(t) + '" y="' + (H - padB + 16) + '" text-anchor="middle">' + t + '</text>';
    }
    if(maxTest % 10 !== 0){
      axisLabelsX += '<text class="axis-label" x="' + xScale(maxTest) + '" y="' + (H - padB + 16) + '" text-anchor="middle">' + maxTest + '</text>';
    }

    const points = testRows.map(r => {
      return { x: xScale(r.test_no), y: yScale(r.marks), r };
    });
    const pathD = points.map((p,i) => (i===0?"M":"L") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");

    let dots = "";
    points.forEach(p => {
      dots += '<circle class="data-dot" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.2">' +
        '<title>Test ' + p.r.test_no + ": " + p.r.marks + " marks</title></circle>";
    });

    let checkpoints = "";
    milestoneRows.forEach(m => {
      const x = xScale(m.test_no);
      const y = yScale(m.avg_marks);
      checkpoints +=
        '<line class="grid-line" x1="' + x + '" y1="' + padT + '" x2="' + x + '" y2="' + (H-padB) + '" stroke-dasharray="2,3"></line>' +
        '<rect class="checkpoint-dot" x="' + (x-5) + '" y="' + (y-5) + '" width="10" height="10" transform="rotate(45 ' + x + ' ' + y + ')">' +
        '<title>Tests ' + m.tests_covered + ' average: ' + m.avg_marks + ' marks</title></rect>' +
        '<text class="avg-tick" x="' + x + '" y="' + (padT - 4) + '" text-anchor="middle">' + m.avg_marks.toFixed(0) + '</text>';
    });

    const svg =
      '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Marks scored by test number">' +
      gridLines +
      '<line class="axis-line" x1="' + padL + '" y1="' + (H-padB) + '" x2="' + (W-padR) + '" y2="' + (H-padB) + '"></line>' +
      '<line class="axis-line" x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (H-padB) + '"></line>' +
      checkpoints +
      '<path class="data-line" d="' + pathD + '"></path>' +
      dots + axisLabelsY + axisLabelsX +
      '</svg>';

    card.innerHTML =
      '<h2>' + SUBJECT_LABEL[state.currentSubject] + ' — score trend' +
      '<span class="legend"><span><i class="line"></i>marks</span><span><i class="checkpoint"></i>10‑test avg</span></span></h2>' +
      svg;
    return card;
  }

  function buildTable(rows){
    const card = document.createElement("div");
    card.className = "table-card";
    const showRank = state.currentSubject === "consolidated" && rows.some(r => !r.cumulative && r.rank != null);
    const colSpan = showRank ? 3 : 2;

    function renderColumn(chunk){
      let thead = "<tr><th>Test</th><th class='num'>Marks</th>";
      if(showRank) thead += "<th class='num'>Rank</th>";
      thead += "</tr>";

      let tbody = "";
      chunk.forEach(r => {
        if(r.cumulative){
          tbody += '<tr class="milestone-row"><td class="ms-label" colspan="' + colSpan + '">' +
            'Avg (' + r.tests_covered + ') — ' + r.avg_marks + '</td></tr>';
        } else {
          tbody += "<tr><td>" + r.test_no + "</td>" +
            "<td class='num'>" + r.marks + "</td>";
          if(showRank) tbody += "<td class='num'>" + (r.rank != null ? r.rank : "—") + "</td>";
          tbody += "</tr>";
        }
      });

      return '<div class="table-col"><table><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table></div>';
    }

    // Split into adjacent columns of ~18 rows each (max 3 columns) so the
    // list reads left-to-right, top-to-bottom instead of one long scroll.
    const targetRowsPerCol = 18;
    const colCount = Math.min(3, Math.max(1, Math.ceil(rows.length / targetRowsPerCol)));
    const chunkSize = Math.ceil(rows.length / colCount);
    let columnsHtml = "";
    for(let i = 0; i < rows.length; i += chunkSize){
      columnsHtml += renderColumn(rows.slice(i, i + chunkSize));
    }

    card.innerHTML =
      '<h2>' + SUBJECT_LABEL[state.currentSubject] + ' — test‑wise marks</h2>' +
      '<div class="table-columns">' + columnsHtml + '</div>';
    return card;
  }

  // ---------------- Add student panel ----------------
  el("ns-submit").addEventListener("click", async () => {
    const msg = el("ns-msg");
    msg.textContent = ""; msg.className = "panel-msg";
    const id = el("ns-id").value.trim(), name = el("ns-name").value.trim();
    if(!id || !name){ msg.textContent = "Enter both an ID and a name."; msg.className = "panel-msg err"; return; }
    try{
      await apiPost("/api/students", { id, name });
      msg.textContent = "Added " + name + ".";
      msg.className = "panel-msg ok";
      el("ns-id").value = ""; el("ns-name").value = "";
      state.currentStudent = id;
      loadStudents();
    } catch(err){
      msg.textContent = err.message;
      msg.className = "panel-msg err";
    }
  });

  // ---------------- Enter marks (all three subjects at once) ----------------
  async function suggestNextTestNo(studentId){
    try{
      const rows = await apiGet("/api/scores?student=" + encodeURIComponent(studentId) + "&subject=consolidated");
      const testRows = rows.filter(r => !r.cumulative);
      if(!testRows.length) return 1;
      return Math.max(...testRows.map(r => r.test_no)) + 1;
    } catch(err){
      return "";
    }
  }

  async function renderEntryForm(){
    const content = el("content");
    if(!state.currentStudent){
      renderEmpty("No student selected", "Use \u201c+ Add student\u201d above the tabs, then come back to enter marks.");
      return;
    }
    const student = state.students.find(s => s.id === state.currentStudent);
    content.innerHTML = '<div class="state"><h3>Setting up entry form…</h3></div>';
    const nextTest = await suggestNextTestNo(state.currentStudent);

    const card = document.createElement("div");
    card.className = "entry-card";
    card.innerHTML =
      '<h2>Enter marks — ' + escapeHtml(student ? student.name : state.currentStudent) + '</h2>' +
      '<p class="entry-sub">One test at a time. Fill in Physics, Chemistry and Maths together — the consolidated total is worked out automatically.</p>' +
      '<div class="entry-grid">' +
        '<div class="field test-no"><label>Test no.</label><input id="em-testno" type="number" min="1" value="' + (nextTest || "") + '" /></div>' +
        '<div class="field"><label>Physics</label><input id="em-physics" type="number" step="any" min="0" placeholder="0–100" /></div>' +
        '<div class="field"><label>Chemistry</label><input id="em-chemistry" type="number" step="any" min="0" placeholder="0–100" /></div>' +
        '<div class="field"><label>Maths</label><input id="em-maths" type="number" step="any" min="0" placeholder="0–100" /></div>' +
      '</div>' +
      '<div class="entry-grid" style="grid-template-columns:1fr; max-width:200px;">' +
        '<div class="field"><label>Rank (optional)</label><input id="em-rank" type="number" step="any" min="0" placeholder="Optional" /></div>' +
      '</div>' +
      '<div class="entry-actions">' +
        '<button class="btn entry-submit" id="em-submit">Save this test</button>' +
        '<span class="entry-msg" id="em-msg"></span>' +
      '</div>';

    content.innerHTML = "";
    content.appendChild(card);
    el("em-physics").focus();

    el("em-submit").addEventListener("click", submitEntry);
  }

  async function submitEntry(){
    const msg = el("em-msg");
    msg.textContent = ""; msg.className = "entry-msg";

    const testNo = el("em-testno").value.trim();
    const physics = el("em-physics").value.trim();
    const chemistry = el("em-chemistry").value.trim();
    const maths = el("em-maths").value.trim();
    const rank = el("em-rank").value.trim();

    if(!testNo || physics === "" || chemistry === "" || maths === ""){
      msg.textContent = "Fill in the test number and all three subjects.";
      msg.className = "entry-msg err";
      return;
    }

    const submitBtn = el("em-submit");
    submitBtn.disabled = true;
    msg.textContent = "Saving…";
    msg.className = "entry-msg";

    try{
      const subjects = [
        { subject: "physics", marks: physics },
        { subject: "chemistry", marks: chemistry },
        { subject: "maths", marks: maths },
      ];
      for(let i = 0; i < subjects.length; i++){
        const payload = {
          student: state.currentStudent,
          test_no: Number(testNo),
          subject: subjects[i].subject,
          marks: Number(subjects[i].marks),
        };
        if(rank !== "" && i === subjects.length - 1) payload.rank = Number(rank);
        await apiPost("/api/scores", payload);
      }
      msg.textContent = "Saved test " + testNo + ".";
      msg.className = "entry-msg ok";
      el("em-testno").value = Number(testNo) + 1;
      el("em-physics").value = "";
      el("em-chemistry").value = "";
      el("em-maths").value = "";
      el("em-rank").value = "";
      el("em-physics").focus();
    } catch(err){
      msg.textContent = err.message;
      msg.className = "entry-msg err";
    } finally {
      submitBtn.disabled = false;
    }
  }

  // ---------------- Init ----------------
  loadStudents();
})();
</script>
</body>
</html>
