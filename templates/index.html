<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEE Mock Test Marks Analyser</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{--ink:#0e1b26;--soft:#4b5a66;--paper:#eef3f3;--card:#fff;--border:#d8e0e0;--accent:#3a6ea5;--accentbg:#e9f0f8;--good:#2e8b57;--bad:#c0392b}
*{box-sizing:border-box}html,body{margin:0}body{background:linear-gradient(rgba(14,27,38,.07) 1px,transparent 1px) 0 0/100% 28px,var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}
button,input{font:inherit}.top{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.brand{font-size:16px;font-weight:800}.brand span{color:#8fb4dc}.students{display:flex;gap:8px;flex-wrap:wrap}.student{border:1px solid #ffffff22;background:#ffffff10;color:#bdc8d0;border-radius:20px;padding:7px 14px;cursor:pointer}.student.active{background:#fff;color:var(--ink)}.status{margin-left:auto;font-size:12px;color:#9eabb4}
.tabs{display:flex;gap:6px;padding:18px 20px 0}.tab{border:0;padding:10px 18px;background:#dce4e4;cursor:pointer;font-weight:700}.tab.active{background:var(--accent);color:#fff}
main{background:var(--card);border-top:4px solid var(--accent);padding:24px 20px 40px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{background:var(--accentbg);border:1px solid var(--border);border-radius:10px;padding:14px}.label{font-size:11px;color:var(--soft);text-transform:uppercase}.value{font-size:24px;font-weight:800;color:var(--accent);margin-top:5px}.sub{font-size:11px;color:var(--soft);margin-top:2px}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px}.card h2{font-size:14px;margin:0 0 14px;text-transform:uppercase;color:var(--soft)}.chart{height:320px}
.scroll{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:8px}table{width:100%;border-collapse:collapse;font-family:monospace;font-size:13px}th{position:sticky;top:0;background:var(--ink);color:#fff;text-align:left;padding:10px}td{padding:9px 10px;border-bottom:1px solid var(--border)}td.num,th.num{text-align:right}.cum td{background:var(--ink);color:#fff;font-weight:bold}.bar{height:6px;background:var(--border);border-radius:5px;overflow:hidden}.fill{height:100%;background:var(--accent)}.empty{text-align:center;padding:35px;color:var(--soft)}
.entry{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.entry label{font-size:11px;color:var(--soft);font-weight:700}.entry input{width:100%;margin-top:5px;border:1px solid var(--border);border-radius:7px;padding:10px;background:#fff}.actions{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:7px;padding:10px 16px;cursor:pointer;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:#e8eeee;color:var(--ink)}.message{font-size:12px;color:var(--soft)}.danger{color:var(--bad)}.ok{color:var(--good)}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.entry{grid-template-columns:repeat(2,1fr)}.chart{height:260px}.tab{padding:9px 11px;font-size:11px}.top{padding:12px}.status{margin-left:0;width:100%}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">JEE<span>ANALYSER</span></div>
  <div class="students" id="students"></div>
  <div class="status" id="status">connecting…</div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-subject="physics">Physics</button>
  <button class="tab" data-subject="chemistry">Chemistry</button>
  <button class="tab" data-subject="maths">Maths</button>
  <button class="tab" data-subject="consolidated">Consolidated</button>
</nav>

<main>
<section class="stats">
  <div class="stat"><div class="label">Latest score</div><div class="value" id="latest">—</div><div class="sub" id="latestSub">—</div></div>
  <div class="stat"><div class="label">Average</div><div class="value" id="average">—</div><div class="sub" id="averageSub">—</div></div>
  <div class="stat"><div class="label">Best score</div><div class="value" id="best">—</div><div class="sub" id="bestSub">—</div></div>
  <div class="stat"><div class="label">Tests recorded</div><div class="value" id="count">—</div><div class="sub">of 60 tests</div></div>
</section>

<section class="card">
  <h2 id="chartTitle">Marks trend</h2>
  <div class="chart"><canvas id="chart"></canvas></div>
</section>

<section class="card">
  <h2>Manual data entry</h2>
  <div class="entry">
    <label>Test #<input id="testNo" type="number" min="1" max="60" placeholder="26"></label>
    <label>Date<input id="date" type="date"></label>
    <label>Physics<input id="physics" type="number" min="0" max="100" placeholder="0–100"></label>
    <label>Chemistry<input id="chemistry" type="number" min="0" max="100" placeholder="0–100"></label>
    <label>Maths<input id="maths" type="number" min="0" max="100" placeholder="0–100"></label>
    <label>Rank<input id="rank" type="number" min="1" placeholder="optional"></label>
  </div>
  <div class="actions">
    <button class="primary" id="save">Save mock to GitHub</button>
    <button class="secondary" id="clear">Clear</button>
    <span class="message" id="saveMsg"></span>
  </div>
  <div class="message" style="margin-top:8px">
    Your Flask backend currently protects POST requests with <code>X-API-Key</code>.
    Enter that key below once per browser.
    <input id="apiKey" type="password" placeholder="API write key" style="max-width:220px;margin-left:8px;padding:7px;border:1px solid var(--border);border-radius:6px">
  </div>
</section>

<section class="card">
  <h2 id="tableTitle">Test-wise scorecard</h2>
  <div class="scroll">
    <table>
      <thead><tr><th>Test</th><th>Date</th><th class="num">Marks</th><th class="num">Max</th><th>Percentage</th><th>Trend</th></tr></thead>
      <tbody id="table"></tbody>
    </table>
  </div>
</section>
</main>

<script>
const A={
 physics:{color:'#3A6EA5',bg:'#E9F0F8'},
 chemistry:{color:'#3F8F6B',bg:'#E9F5EF'},
 maths:{color:'#C4682B',bg:'#FBEEE3'},
 consolidated:{color:'#7A5C9E',bg:'#F1EBF6'}
};
let S={students:[],student:null,subject:'physics',scores:[],chart:null};

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const label=s=>s[0].toUpperCase()+s.slice(1);

function accent(){
 const a=A[S.subject];
 document.documentElement.style.setProperty('--accent',a.color);
 document.documentElement.style.setProperty('--accentbg',a.bg);
}

async function api(url,options={}){
 const r=await fetch(url,options);
 let body=null;
 try{body=await r.json()}catch{}
 if(!r.ok) throw new Error(body?.error||`HTTP ${r.status}`);
 return body;
}

async function loadStudents(){
 try{
   const data=await api('/api/students');
   S.students=Array.isArray(data)?data:[];
   $('students').innerHTML=S.students.map((s,i)=>`<button class="student ${i===0?'active':''}" data-id="${esc(s.id)}">${esc(s.name)}</button>`).join('');
   $('status').textContent=`${S.students.length} student(s)`;
   if(S.students.length){S.student=S.students[0].id;loadScores()}
   else renderEmpty('No students found.');
 }catch(e){$('status').textContent='API error';renderEmpty(`Could not load students: ${e.message}`)}
}

$('students').addEventListener('click',e=>{
 const b=e.target.closest('.student');if(!b)return;
 document.querySelectorAll('.student').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');S.student=b.dataset.id;loadScores();
});

$('tabs').addEventListener('click',e=>{
 const b=e.target.closest('.tab');if(!b)return;
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');S.subject=b.dataset.subject;accent();loadScores();
});

function renderEmpty(msg){
 $('table').innerHTML=`<tr><td colspan="6" class="empty">${esc(msg)}</td></tr>`;
 $('latest').textContent=$('average').textContent=$('best').textContent=$('count').textContent='—';
 if(S.chart){S.chart.destroy();S.chart=null}
}

async function loadScores(){
 if(!S.student)return;
 $('table').innerHTML='<tr><td colspan="6" class="empty">Loading…</td></tr>';
 $('chartTitle').textContent=`${label(S.subject)} — marks trend`;
 $('tableTitle').textContent=`${label(S.subject)} — test-wise scorecard`;
 try{
   const data=await api(`/api/scores?student=${encodeURIComponent(S.student)}&subject=${encodeURIComponent(S.subject)}`);
   S.scores=Array.isArray(data)?data:[];
   render();
 }catch(e){renderEmpty(`Could not load scores: ${e.message}`)}
}

function render(){
 const real=S.scores.filter(x=>!x.cumulative);
 $('count').textContent=real.length;
 if(!real.length){renderEmpty('No scores recorded yet.');return}
 const latest=real[real.length-1], marks=real.map(x=>Number(x.marks));
 const avg=marks.reduce((a,b)=>a+b,0)/marks.length;
 const best=Math.max(...marks);
 $('latest').textContent=`${latest.marks}/${latest.max_marks}`;
 $('latestSub').textContent=`Test ${latest.test_no}`;
 $('average').textContent=avg.toFixed(1);
 $('averageSub').textContent=`${(avg/Number(real[0].max_marks)*100).toFixed(1)}% avg`;
 $('best').textContent=`${best}`;
 $('bestSub').textContent=`Test ${real.find(x=>Number(x.marks)===best).test_no}`;
 renderTable();
 renderChart(real);
}

function renderTable(){
 let html='';
 let prev=null;
 for(const x of S.scores){
   if(x.cumulative){
     html+=`<tr class="cum"><td colspan="6">10-test average · ${esc(x.tests_covered||'')}</td></tr>`;
     continue;
   }
   const pct=Number(x.marks)/Number(x.max_marks)*100;
   let trend='—',cls='';
   if(prev!==null){if(x.marks>prev){trend='▲';cls='ok'}else if(x.marks<prev){trend='▼';cls='danger'}else{trend='→'}}
   prev=Number(x.marks);
   html+=`<tr><td>#${x.test_no}</td><td>${esc(x.date||'—')}</td><td class="num"><b>${x.marks}</b></td><td class="num">${x.max_marks}</td><td><div style="display:flex;gap:8px;align-items:center"><div class="bar"><div class="fill" style="width:${Math.min(100,pct)}%"></div></div><span>${pct.toFixed(1)}%</span></div></td><td class="${cls}">${trend}</td></tr>`;
 }
 $('table').innerHTML=html;
}

function renderChart(real){
 const ctx=$('chart').getContext('2d');
 if(S.chart)S.chart.destroy();
 S.chart=new Chart(ctx,{
   type:'line',
   data:{labels:real.map(x=>`T${x.test_no}`),datasets:[{data:real.map(x=>x.marks),borderColor:A[S.subject].color,backgroundColor:A[S.subject].bg,borderWidth:2,tension:.25,fill:true,pointRadius:3}]},
   options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,suggestedMax:100}}}
 });
}

function clearForm(){
 ['testNo','date','physics','chemistry','maths','rank'].forEach(id=>$(id).value='');
 $('saveMsg').textContent='';
}

$('clear').onclick=clearForm;

$('save').onclick=async()=>{
 const msg=$('saveMsg');msg.className='message';msg.textContent='Saving…';
 const key=$('apiKey').value.trim();
 const testNo=Number($('testNo').value);
 const p=$('physics').value, c=$('chemistry').value, m=$('maths').value, rank=$('rank').value;
 if(!S.student){msg.textContent='No student selected';msg.className='message danger';return}
 if(!key){msg.textContent='Enter your API write key';msg.className='message danger';return}
 if(!Number.isInteger(testNo)||testNo<1||testNo>60){msg.textContent='Test number must be 1–60';msg.className='message danger';return}
 if(p===''||c===''||m===''){msg.textContent='Enter Physics, Chemistry and Maths';msg.className='message danger';return}
 if([p,c,m].some(v=>Number(v)<0||Number(v)>100)){msg.textContent='Subject marks must be 0–100';msg.className='message danger';return}
 try{
   const headers={'Content-Type':'application/json','X-API-Key':key};
   const base={student:S.student,test_no:testNo,date:$('date').value||null};
   for(const [subject,value] of [['physics',p],['chemistry',c],['maths',m]]){
     const body={...base,subject,marks:Number(value)};
     if(rank!=='')body.rank=Number(rank);
     await api('/api/scores',{method:'POST',headers,body:JSON.stringify(body)});
   }
   localStorage.setItem('jee_api_key',key);
   msg.textContent='Saved to GitHub ✓';msg.className='message ok';
   await loadScores();
   clearForm();
 }catch(e){msg.textContent=`Save failed: ${e.message}`;msg.className='message danger'}
};

const storedKey=localStorage.getItem('jee_api_key');
if(storedKey)$('apiKey').value=storedKey;
accent();
loadStudents();
</script>
</body>
</html>
